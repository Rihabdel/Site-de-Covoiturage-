services:

  api:
    build: ./Backend
    container_name: Ecoride_symfony_back
    ports:
      - "8000:80"
    volumes:
      - ./Backend:/var/www/html
      - symfony_var:/var/www/html/var
      - symfony_vendor:/var/www/html/vendor
    depends_on:
      - database
  frontend:
    build: ./FrontendBootstrap
    container_name: Ecoride_bootstrap_front
    ports:
      - "5173:80"
    tty: true  
    volumes:
      - ./FrontendBootstrap:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev -- --host 
    depends_on:
      - api
  database:
    image: postgres:16-alpine
    container_name: ecoride_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ecoride_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  mongodb:
      image: mongo:7
      container_name: ecoride
      ports:
        - "27017:27017"

volumes:
  symfony_var:
  symfony_vendor:
  db_data: